name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Assets are attached straight to the draft GitHub Release instead of passing
# through Actions artifacts: artifact storage is quota-billed (and currently
# exhausted on this account), while release assets are not metered.

jobs:
  # Create the draft release up front so the build jobs can attach their
  # assets concurrently without racing to create it.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

      # Mirror draft in the public releases-only repo: this is the feed
      # electron-updater polls, since the source repo is private. Needs a PAT
      # with contents:write on DeYinAI/deyin-releases stored as RELEASES_TOKEN.
      # Non-fatal: a missing/invalid token must not block the installer builds
      # (the source-repo draft above is still created either way).
      - name: Create draft in public releases repo
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: DeYinAI/deyin-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true

  build:
    # Tag pushes attach installers to the draft; workflow_dispatch runs are
    # smoke builds (create-release is skipped, and so is the upload step).
    needs: create-release
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
    strategy:
      # One OS failing must not cancel the others.
      fail-fast: false
      matrix:
        # Self-hosted runners: win-runner (dev machine) + dell-runner (Dell box);
        # hosted runners are blocked by the Actions budget. To restore the macOS
        # .dmg leg once a Mac runner or hosted budget exists, add:
        #   - { name: macos, labels: macos-latest }
        include:
          # ebcache: winCodeSign's archive contains symlinks the runner's
          # NETWORK SERVICE account cannot create, so the cache is pre-seeded
          # (symlinks materialized) at C:\runner\ebcache on win-runner.
          - { name: windows, labels: [self-hosted, Windows, X64], ebcache: 'C:\runner\ebcache' }
          - { name: linux, labels: [self-hosted, Linux, X64] }
    runs-on: ${{ matrix.labels }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json;
      # specifying it here too makes action-setup fail with a version conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # No Python/node-gyp needed: electron-builder skips native rebuilds
      # (npmRebuild: false) and node-pty ships N-API prebuilds for win32;
      # the Linux leg compiles node-pty with the system toolchain.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/**" build

      # build/ is gitignored, so regenerate the app icons (icon.png + icon.ico)
      # from the branding SVG before packaging. Uses root devDeps sharp + png-to-ico.
      - name: Generate app icons
        run: pnpm --filter @deyin/branding make-icons

      # Signing (fill in secrets to enable):
      #   macOS:   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
      #   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
      - name: Package installers
        run: pnpm --filter @deyin/desktop package
        env:
          # Empty on legs without a pre-seeded cache; electron-builder then
          # uses its default cache directory.
          ELECTRON_BUILDER_CACHE: ${{ matrix.ebcache }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml

      # Mirror the desktop artifacts (incl. latest*.yml manifests, which the
      # updater resolves first) to the public feed. Publishing this draft is
      # what ships the update to clients. Non-fatal: keep the source-repo draft
      # populated even if the mirror token is missing/invalid.
      - name: Attach installers to public releases repo
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: DeYinAI/deyin-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml

  # CLI single-file executables: bun cross-compiles every target from one runner
  # (no native modules in the CLI, so cross-compilation is safe). Asset names match
  # what `deyin upgrade` and scripts/install.sh expect: deyin-<os>-<arch>[.exe].
  cli:
    needs: create-release
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/**" build

      - name: Compile CLI binaries
        working-directory: apps/cli
        run: |
          mkdir -p dist-bin
          bun scripts/compile.mjs bun-linux-x64 dist-bin/deyin-linux-x64
          bun scripts/compile.mjs bun-linux-arm64 dist-bin/deyin-linux-arm64
          bun scripts/compile.mjs bun-darwin-x64 dist-bin/deyin-darwin-x64
          bun scripts/compile.mjs bun-darwin-arm64 dist-bin/deyin-darwin-arm64
          bun scripts/compile.mjs bun-windows-x64 dist-bin/deyin-windows-x64.exe

      - name: Smoke test host binary
        run: apps/cli/dist-bin/deyin-linux-x64 --version

      - name: Attach CLI binaries to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: apps/cli/dist-bin/*

  # Publish the CLI (and the workspace packages it depends on) to npm with provenance
  # attestations. pnpm rewrites workspace:* ranges to real versions at pack time.
  # Requires the NPM_TOKEN secret; id-token grants the OIDC token provenance needs.
  publish-npm:
    needs: cli
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages + CLI
        run: |
          pnpm --filter "./packages/**" build
          pnpm --filter @deyin/cli build

      - name: Publish to npm
        run: >
          pnpm publish -r --access public --no-git-checks --provenance
          --filter @deyin/oauth-client
          --filter @deyin/host-core
          --filter @deyin/agent-core
          --filter @deyin/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
