name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Assets attach directly to draft GitHub Releases (no Actions artifacts).

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

      - name: Create draft in public releases repo
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: DeYinAI/deyin-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: true
          body: Installers and update manifests for Deyin ${{ github.ref_name }}.

  build:
    needs: create-release
    if: >-
      always() &&
      !cancelled() &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Ensure dotnet on PATH
        run: |
          if [[ -x "$HOME/.dotnet/dotnet" ]]; then
            echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          fi

      - name: Check Dell runner prerequisites
        run: bash scripts/ci/check-dell-runner.sh

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/**" --filter "!@deyin/native-core" build

      - name: Build native-core (optional)
        run: |
          if command -v cargo >/dev/null 2>&1; then
            pnpm --filter @deyin/native-core build
          else
            echo "cargo not found; TS fallbacks will be used"
          fi

      # Linux + Windows installers from dell-runner (Wine + dotnet cross-publish).
      - name: Package Linux and Windows installers
        run: bash scripts/ci/package-desktop.sh all
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml

      - name: Attach installers to public releases repo
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: DeYinAI/deyin-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml

  cli:
    needs: create-release
    if: >-
      always() &&
      !cancelled() &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    permissions:
      contents: write
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/**" --filter "!@deyin/native-core" build

      - name: Compile CLI binaries
        working-directory: apps/cli
        run: |
          mkdir -p dist-bin
          bun scripts/compile.mjs bun-linux-x64 dist-bin/deyin-linux-x64
          bun scripts/compile.mjs bun-linux-arm64 dist-bin/deyin-linux-arm64
          bun scripts/compile.mjs bun-darwin-x64 dist-bin/deyin-darwin-x64
          bun scripts/compile.mjs bun-darwin-arm64 dist-bin/deyin-darwin-arm64
          bun scripts/compile.mjs bun-windows-x64 dist-bin/deyin-windows-x64.exe

      - name: Smoke test host binary
        run: apps/cli/dist-bin/deyin-linux-x64 --version

      - name: Attach CLI binaries to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: apps/cli/dist-bin/*
