name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Assets attach directly to draft GitHub Releases (no Actions artifacts).

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true

      - name: Create draft in public releases repo
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          repository: DeYinAI/deyin-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: true
          body: Installers and update manifests for Deyin ${{ github.ref_name }}.

  build:
    needs: create-release
    if: >-
      always() &&
      !cancelled() &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Self-heal the runner host: checkout brings scripts/ here every run — no manual copy.
      - name: Bootstrap runner toolchain
        run: |
          export PATH="${HOME}/.dotnet:${HOME}/.bun/bin:${PATH}"
          if ! command -v wine >/dev/null 2>&1 || ! dpkg -s wine32 >/dev/null 2>&1 || ! command -v xvfb-run >/dev/null 2>&1; then
            sudo bash scripts/ci/setup-dell-runner.sh
          fi
          if ! command -v dotnet >/dev/null 2>&1 || ! command -v bun >/dev/null 2>&1; then
            bash scripts/ci/setup-dell-runner.sh
          fi
          if [[ ! -d "${HOME}/.wine" ]]; then
            xvfb-run -a wineboot --init || true
          fi
          for dir in "${HOME}/.dotnet" "${HOME}/.bun/bin"; do
            if [[ -d "$dir" ]]; then
              echo "$dir" >> "$GITHUB_PATH"
            fi
          done
          sudo ln -sf "${HOME}/.dotnet/dotnet" /usr/local/bin/dotnet 2>/dev/null || true
          sudo ln -sf "${HOME}/.bun/bin/bun" /usr/local/bin/bun 2>/dev/null || true

      - name: Check Dell runner prerequisites
        run: bash scripts/ci/check-dell-runner.sh

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter "./packages/**" --filter "!@deyin/native-core" build
          pnpm --filter @deyin/computer-use-host build

      - name: Build native-core (optional)
        run: |
          if command -v cargo >/dev/null 2>&1; then
            pnpm --filter @deyin/native-core build || echo "native-core build skipped; TS fallbacks will be used"
          else
            echo "cargo not found; TS fallbacks will be used"
          fi

      # Linux + Windows installers from dell-runner (Wine + dotnet cross-publish).
      - name: Package Linux and Windows installers
        run: bash scripts/ci/package-desktop.sh all
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

      - name: Attach installers to public releases repo
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          repository: DeYinAI/deyin-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

  build-mac:
    needs: create-release
    if: >-
      always() &&
      !cancelled() &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    # GitHub-hosted until a self-hosted Mac registers with label release-mac.
    # Swap to [self-hosted, macOS, release-mac] when mac-runner is online.
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Check macOS build prerequisites
        run: bash scripts/ci/check-mac-runner.sh

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter "./packages/**" --filter "!@deyin/native-core" build
          pnpm --filter @deyin/computer-use-host build

      - name: Build native-core (optional)
        run: |
          if command -v cargo >/dev/null 2>&1; then
            pnpm --filter @deyin/native-core build || echo "native-core build skipped; TS fallbacks will be used"
          else
            echo "cargo not found; TS fallbacks will be used"
          fi

      - name: Package macOS DMG(s)
        run: bash scripts/ci/package-desktop-mac.sh both
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Attach macOS installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml

      - name: Attach macOS installers to public releases repo
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          repository: DeYinAI/deyin-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml

  publish:
    needs: [build, build-mac, cli]
    if: >-
      always() &&
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success' &&
      needs.cli.result == 'success'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      # electron-updater polls GET /releases/latest — must set make_latest or GitHub
      # keeps an older release (e.g. v1.0.7) as "latest" and clients never see updates.
      - name: Publish public update feed
        # A silent no-op here leaves clients on an old version, because
        # electron-updater only sees what this step publishes.
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          # Draft releases are invisible to GET /releases/tags/{tag} — list and match instead.
          release_id="$(gh api "repos/DeYinAI/deyin-releases/releases" --paginate \
            --jq ".[] | select(.tag_name==\"${{ github.ref_name }}\") | .id" | head -1)"
          if [[ -z "$release_id" ]]; then
            echo "Release ${{ github.ref_name }} not found on deyin-releases"
            exit 1
          fi
          gh api -X PATCH "repos/DeYinAI/deyin-releases/releases/${release_id}" \
            --input - <<EOF
          {"draft": false, "make_latest": true}
          EOF

  cli:
    needs: create-release
    if: >-
      always() &&
      !cancelled() &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    permissions:
      contents: write
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter "./packages/**" --filter "!@deyin/native-core" build
          pnpm --filter @deyin/computer-use-host build

      - name: Compile CLI binaries
        working-directory: apps/cli
        run: |
          mkdir -p dist-bin
          bun scripts/compile.mjs bun-linux-x64 dist-bin/deyin-linux-x64
          bun scripts/compile.mjs bun-linux-arm64 dist-bin/deyin-linux-arm64
          bun scripts/compile.mjs bun-darwin-x64 dist-bin/deyin-darwin-x64
          bun scripts/compile.mjs bun-darwin-arm64 dist-bin/deyin-darwin-arm64
          bun scripts/compile.mjs bun-windows-x64 dist-bin/deyin-windows-x64.exe

      - name: Smoke test host binary
        run: apps/cli/dist-bin/deyin-linux-x64 --version

      - name: Attach CLI binaries to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: apps/cli/dist-bin/*
