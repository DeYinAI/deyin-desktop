name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      # One OS failing must not cancel the others (e.g. macOS signing quirks
      # should never block the Windows .exe / Linux artifacts).
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json;
      # specifying it here too makes action-setup fail with a version conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # node-pty is a native module; @electron/rebuild runs node-gyp during
      # packaging. Runners now default to Python 3.12, which removed distutils
      # (node-gyp needs it), so pin 3.11 to keep the native rebuild working.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/**" build

      # build/ is gitignored, so regenerate the app icons (icon.png + icon.ico)
      # from the branding SVG before packaging. Uses root devDeps sharp + png-to-ico.
      - name: Generate app icons
        run: pnpm --filter @deyin/branding make-icons

      # Signing (fill in secrets to enable):
      #   macOS:   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
      #   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
      - name: Package installers
        run: pnpm --filter @deyin/desktop package
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: deyin-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml

  # CLI single-file executables: bun cross-compiles every target from one runner
  # (no native modules in the CLI, so cross-compilation is safe). Asset names match
  # what `deyin upgrade` and scripts/install.sh expect: deyin-<os>-<arch>[.exe].
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/**" build

      - name: Compile CLI binaries
        working-directory: apps/cli
        run: |
          mkdir -p dist-bin
          bun scripts/compile.mjs bun-linux-x64 dist-bin/deyin-linux-x64
          bun scripts/compile.mjs bun-linux-arm64 dist-bin/deyin-linux-arm64
          bun scripts/compile.mjs bun-darwin-x64 dist-bin/deyin-darwin-x64
          bun scripts/compile.mjs bun-darwin-arm64 dist-bin/deyin-darwin-arm64
          bun scripts/compile.mjs bun-windows-x64 dist-bin/deyin-windows-x64.exe

      - name: Smoke test host binary
        run: apps/cli/dist-bin/deyin-linux-x64 --version

      - name: Upload CLI binaries
        uses: actions/upload-artifact@v4
        with:
          name: deyin-cli
          path: apps/cli/dist-bin/*

  # Publish the CLI (and the workspace packages it depends on) to npm with provenance
  # attestations. pnpm rewrites workspace:* ranges to real versions at pack time.
  # Requires the NPM_TOKEN secret; id-token grants the OIDC token provenance needs.
  publish-npm:
    needs: cli
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages + CLI
        run: |
          pnpm --filter "./packages/**" build
          pnpm --filter @deyin/cli build

      - name: Publish to npm
        run: >
          pnpm publish -r --access public --no-git-checks --provenance
          --filter @deyin/oauth-client
          --filter @deyin/host-core
          --filter @deyin/agent-core
          --filter @deyin/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Attach every platform's installers + CLI binaries to the GitHub Release for the
  # tag, so there are stable download URLs (electron-updater feed, `deyin upgrade`,
  # and the curl install script all point here). Runs after all builds pass.
  release:
    needs: [build, cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          draft: true
          generate_release_notes: true
