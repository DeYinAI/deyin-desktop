name: Release Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      # One OS failing must not cancel the others (e.g. macOS signing quirks
      # should never block the Windows .exe / Linux artifacts).
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json;
      # specifying it here too makes action-setup fail with a version conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # node-pty is a native module; @electron/rebuild runs node-gyp during
      # packaging. Runners now default to Python 3.12, which removed distutils
      # (node-gyp needs it), so pin 3.11 to keep the native rebuild working.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/**" build

      # build/ is gitignored, so regenerate the app icons (icon.png + icon.ico)
      # from the branding SVG before packaging. Uses root devDeps sharp + png-to-ico.
      - name: Generate app icons
        run: pnpm --filter @deyin/branding make-icons

      # Signing (fill in secrets to enable):
      #   macOS:   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
      #   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
      - name: Package installers
        run: pnpm --filter @deyin/desktop package
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: deyin-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml

  # Attach every platform's installers to the GitHub Release for the tag, so
  # there are stable download URLs (and the electron-updater generic feed can be
  # pointed at them). Only runs for tag pushes, after all matrix builds pass.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          draft: true
          generate_release_notes: true
