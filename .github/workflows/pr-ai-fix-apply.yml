name: PR AI Fix Apply

on:
  issue_comment:
    types: [created]

jobs:
  apply-ai-fixes:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/ai-fix apply') &&
      github.actor != 'dependabot[bot]' &&
      (github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issue.number,
            });
            if (pr.data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('AI fix apply only works on same-repo pull requests.');
              return;
            }
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('number', String(pr.data.number));

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply AI review fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: pnpm exec tsx scripts/ci/ai-fix-apply.ts
