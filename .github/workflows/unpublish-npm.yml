name: Remove npm packages

on:
  workflow_dispatch:

jobs:
  unpublish:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Unpublish initial public packages
        run: |
          npm unpublish @deyin/cli@0.1.1 --force
          npm unpublish @deyin/agent-core@0.1.1 --force
          npm unpublish @deyin/host-core@0.1.1 --force
          npm unpublish @deyin/oauth-client@0.1.1 --force
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
