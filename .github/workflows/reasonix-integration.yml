name: Advanced agent Integration

on:
  push:
    branches: [main]
    paths:
      - "packages/agent-core/**"
      - "apps/desktop/**"
      - "docs/**"
      - ".github/workflows/agent-integration.yml"
  pull_request:
    paths:
      - "packages/agent-core/**"
      - "apps/desktop/**"
      - "docs/**"
      - ".github/workflows/agent-integration.yml"
  workflow_dispatch:

jobs:
  agent-integration:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build agent-core
        run: pnpm --filter @deyin/agent-core build

      - name: Advanced agent integration suite (174 tests)
        run: pnpm --filter @deyin/agent-core test:agent

      - name: Migration tests
        run: pnpm --filter @deyin/agent-core test:migration

      - name: Edge case tests
        run: pnpm --filter @deyin/agent-core test:edge

      - name: Load tests
        run: pnpm --filter @deyin/agent-core test:load

      - name: Performance benchmarks
        run: pnpm --filter @deyin/agent-core benchmark

      - name: Cache guard validation (≥85% tail average)
        run: |
          cd packages/agent-core
          tsx -e "
            import { runCacheGuard, CACHE_HIT_RATE_TARGET } from './src/testing/cache-guard.js';
            const results = runCacheGuard();
            const avg = results.reduce((s, r) => s + r.hitRate, 0) / results.length;
            console.log('Tail-average hit rate:', (avg * 100).toFixed(1) + '%');
            if (avg < ${CACHE_HIT_RATE_TARGET:-0.85}) process.exit(1);
          "

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: docs/PERFORMANCE_REPORT.md
