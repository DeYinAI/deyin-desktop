name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Self-hosted (dell-runner): hosted runners are blocked by the Actions budget.
    # Dependabot PRs skip verify — they were hogging the single runner for hours.
    if: github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the "packageManager" field in package.json;
      # specifying it here too makes action-setup fail with a version conflict.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (build + typecheck + test + app builds)
        run: bash scripts/verify.sh

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Requires Dependency graph enabled: Settings → Security → Dependency graph
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
