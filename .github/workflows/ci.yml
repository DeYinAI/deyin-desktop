name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    # Self-hosted (dell-runner): hosted runners are blocked by the Actions budget.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5

      # pnpm version comes from the "packageManager" field in package.json;
      # specifying it here too makes action-setup fail with a version conflict.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (build + typecheck + test + app builds)
        run: bash scripts/verify.sh

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
