appId: com.deyin.desktop
productName: Deyin
copyright: Copyright (c) 2026 Deyin
# node-pty is the only native module and it uses N-API (stable ABI across Node
# and Electron) with prebuilt binaries, so no from-source Electron rebuild is
# needed. Skipping it avoids @electron/rebuild -> node-gyp (and the Windows
# Visual Studio detection failure) entirely, and keeps builds fast.
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# Ship the bundled DeYinAI Embedding ONNX model pack (if present) alongside
# the app so the optimization plugin can use it without a user download.
extraResources:
  # Runtime tray/window icon (generated by @deyin/branding make-icons).
  - from: build/icon.png
    to: icon.png
  - from: ../../packages/plugins/optimization/models
    to: optimization-models
    filter:
      - "**/*"
      - "!.gitkeep"
  - from: bundled-plugins
    to: bundled-plugins
    filter:
      - "**/*"
# node-pty ships a native .node binary; it must stay outside the asar archive
# so it can be dlopen'd at runtime. The terminal degrades gracefully if absent.
asarUnpack:
  - "**/node_modules/node-pty/**"
  - "**/node_modules/ssh2/**"
  - "**/node_modules/cpu-features/**"
# Custom protocol for the OAuth deep-link callback (deyin://oauth/callback).
# electron-builder writes the macOS CFBundleURLTypes and the Linux .desktop
# MimeType; Windows registration happens at runtime via
# app.setAsDefaultProtocolClient (see src/main/index.ts).
protocols:
  - name: Deyin
    schemes:
      - deyin
# Icons: pnpm --filter @deyin/branding make-icons -> build/icon.{png,ico,icns}
# package scripts run make-icons automatically via prepackage.
win:
  target: [nsis]
  icon: build/icon.ico
  # Must stay space-free: GitHub rewrites spaces in uploaded asset names to dots
  # while electron-builder writes hyphenated URLs into latest.yml, and the
  # mismatch makes electron-updater 404 when fetching the installer.
  artifactName: Deyin-Setup-${version}.${ext}
mac:
  target: [dmg]
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # Skip code signing on CI (no Apple cert). electron-builder's empty-password
  # fallback can fail the build; null disables signing cleanly for an unsigned
  # DMG. Set an identity + notarization secrets to ship a signed build.
  identity: null
linux:
  target: [deb, AppImage]
  icon: build/icon.png
  category: Development
  executableName: deyin
  # Clean artifact filenames (the scoped npm name would otherwise embed a slash).
  artifactName: deyin-${version}-${arch}.${ext}
  # Advertise the scheme handler in the generated .desktop entry so the deb
  # install registers deyin:// system-wide.
  desktop:
    entry:
      MimeType: x-scheme-handler/deyin;
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
# electron-updater reads this at runtime from the embedded app-update.yml, so
# it must point at a PUBLIC repo: the client fetches releases anonymously.
# Source stays private in deyin-desktop; installers + latest*.yml manifests are
# mirrored here by .github/workflows/release.yml.
publish:
  provider: github
  owner: DeYinAI
  repo: deyin-releases
