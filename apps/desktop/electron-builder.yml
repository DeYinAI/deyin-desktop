appId: com.deyin.desktop
productName: Deyin
copyright: Copyright (c) 2026 Deyin
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# node-pty ships a native .node binary; it must stay outside the asar archive
# so it can be dlopen'd at runtime. The terminal degrades gracefully if absent.
asarUnpack:
  - "**/node_modules/node-pty/**"
# Custom protocol for the OAuth deep-link callback (deyin://oauth/callback).
# electron-builder writes the macOS CFBundleURLTypes and the Linux .desktop
# MimeType; Windows registration happens at runtime via
# app.setAsDefaultProtocolClient (see src/main/index.ts).
protocols:
  - name: Deyin
    schemes:
      - deyin
# Icons are generated from packages/branding:
#   node packages/branding/scripts/rasterize.mjs   (needs `sharp`)
#   then png-to-ico for build/icon.ico
win:
  target: [nsis]
  icon: build/icon.ico
mac:
  target: [dmg]
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # Skip code signing on CI (no Apple cert). electron-builder's empty-password
  # fallback can fail the build; null disables signing cleanly for an unsigned
  # DMG. Set an identity + notarization secrets to ship a signed build.
  identity: null
linux:
  target: [deb, AppImage]
  icon: build/icon.png
  category: Development
  executableName: deyin
  # Clean artifact filenames (the scoped npm name would otherwise embed a slash).
  artifactName: deyin-${version}-${arch}.${ext}
  # Advertise the scheme handler in the generated .desktop entry so the deb
  # install registers deyin:// system-wide.
  desktop:
    entry:
      MimeType: x-scheme-handler/deyin;
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: generic
  url: https://cdn.deyin.dev/desktop/releases
