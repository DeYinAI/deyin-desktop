<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deyin mark: geometric lowercase "d" with an orbit dot. Original artwork.
       No enclosing tile — the glyph is optically centred on the canvas
       (content spans x 95..417, y 65..447) so it sits right in a dock, a
       favicon, or inline in the UI without extra padding.

       One flat blue-grey, no gradient. The value is picked to clear both theme
       grounds: it stays legible on the dark #181818 window and on the light
       #f4f4f3 one, which matters because the mark carries no background of
       its own. -->
  <!-- bowl of the "d" -->
  <circle cx="214" cy="328" r="96" stroke="#7488a0" stroke-width="58" fill="none"/>
  <!-- ascender of the "d" -->
  <path d="M310 88V424" stroke="#7488a0" stroke-width="58" stroke-linecap="round"/>
  <!-- orbit dot -->
  <circle cx="390" cy="115" r="27" fill="#7488a0"/>
</svg>
